# Nginx config untuk serving React SPA (client-side routing)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression untuk asset statis
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache busting: file dengan hash di namanya (Vite default) — cache lama
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html tidak di-cache agar routing update selalu dapat file terbaru
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Semua route lain diarahkan ke index.html (React Router SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
