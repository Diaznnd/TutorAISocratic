# ── Nginx Reverse Proxy ─────────────────────────────────────────────────────────
# Konfigurasi production: HTTP only (pakai IP langsung, tanpa domain/SSL)
# IP VPS TencentCloud: ganti VPS_IP_ADDRESS dengan IP aktual di .env atau langsung di sini

upstream backend {
    server backend:4000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;          # terima semua host / IP

    server_tokens off;      # sembunyikan versi Nginx

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── API routes → backend container ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;

        # Penting: SSE (streaming tutor AI) butuh buffering off
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        client_max_body_size 2m;
    }

    # ── Frontend static files → frontend container ───────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
